<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Bright pink-magenta core, slightly off-centre for a swirly feel -->
    <radialGradient id="core" cx="42%" cy="44%" r="35%">
      <stop offset="0%" stop-color="#ffd6e6"/>
      <stop offset="35%" stop-color="#ff5e8a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ff5e8a" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet-blue outer halo -->
    <radialGradient id="halo" cx="58%" cy="56%" r="62%">
      <stop offset="0%" stop-color="#8a66ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2a2a8e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06061a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep-space backdrop -->
  <rect width="32" height="32" fill="#05050d" rx="4"/>

  <!-- Nebula -->
  <circle cx="16" cy="16" r="16" fill="url(#halo)"/>
  <circle cx="13" cy="14" r="11" fill="url(#core)"/>

  <!-- Stars -->
  <circle cx="4"  cy="5"  r="0.7" fill="#ffffff"/>
  <circle cx="27" cy="7"  r="0.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="28" cy="22" r="0.7" fill="#ffffff"/>
  <circle cx="6"  cy="26" r="0.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="22" cy="28" r="0.4" fill="#ffffff" opacity="0.7"/>
  <circle cx="2"  cy="17" r="0.35" fill="#ffffff" opacity="0.65"/>
</svg>
