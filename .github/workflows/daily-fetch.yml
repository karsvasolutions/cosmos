name: Daily fetch

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Fetch latest images
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: npm run fetch -- --keep-on-empty
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/images.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/images.json
            git commit -m "data: daily fetch $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to images.json"
          fi
